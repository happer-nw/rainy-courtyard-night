<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨夜庭院街角</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#070a16}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer / camera ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080c1c);
scene.fog=new THREE.FogExp2(0x080c1c,0.013);
const camera=new THREE.PerspectiveCamera(38,window.innerWidth/window.innerHeight,0.1,220);
camera.position.set(23,22,27);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);
controls.enableDamping=true;controls.dampingFactor=0.06;
controls.enablePan=true;controls.minDistance=7;controls.maxDistance=62;
controls.maxPolarAngle=Math.PI*0.485;
controls.update();

/* ---------- utils ---------- */
const V3=THREE.Vector3,PI=Math.PI;
let sd=11;
const R=()=>(sd=sd*16807%2147483647)/2147483647;
const rr=(a,b)=>a+R()*(b-a);
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);};
const ss=(x,a,b)=>{const k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k);};
const _d=new THREE.Object3D(),_m=new THREE.Matrix4(),_c=new THREE.Color();

function ctex(w,h,fn,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
const FONT='"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","Microsoft YaHei","PingFang SC",serif';
function txt(s,o={}){
  const fs=o.fs||96,ch=[...s],n=ch.length;
  const W=o.w||(o.v?fs*1.5:fs*(n*(o.lat?0.62:1.05)+0.7)),H=o.h||(o.v?fs*(n*1.08+0.5):fs*1.5);
  return ctex(Math.ceil(W),Math.ceil(H),(c,w,h)=>{
    if(o.bg){c.fillStyle=o.bg;c.fillRect(0,0,w,h);}
    if(o.bd){c.strokeStyle=o.bd;c.lineWidth=fs*0.07;c.strokeRect(fs*0.12,fs*0.12,w-fs*0.24,h-fs*0.24);}
    c.font='bold '+fs+'px '+(o.lat?'monospace':FONT);c.textAlign='center';c.textBaseline='middle';c.fillStyle=o.fg||'#fff';
    if(o.glow){c.shadowColor=o.glow;c.shadowBlur=fs*0.28;}
    if(o.v)ch.forEach((k,i)=>c.fillText(k,w/2,fs*(0.8+i*1.08)));else c.fillText(s,w/2,h/2+fs*0.04);
  });
}

/* ---------- canvas textures ---------- */
const glowTex=ctex(128,128,c=>{const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.35,'rgba(255,255,255,0.45)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,128,128);});
const slabTex=ctex(512,512,(c,W,H)=>{
  c.fillStyle='#343b49';c.fillRect(0,0,W,H);
  for(let r=0;r<8;r++){let x=-rr(0,40);const y=r*64;
    while(x<W){const w=rr(70,150),v=rr(-16,16)|0;
      c.fillStyle='rgb('+(126+v)+','+(137+v)+','+(154+v)+')';c.fillRect(x+2,y+2,w-4,60);
      c.fillStyle='rgba(200,222,255,0.13)';c.fillRect(x+6,y+5,w-12,5);
      if(R()<0.3){c.fillStyle='rgba(46,78,56,0.4)';c.fillRect(x+2,y+52,w-4,10);}
      if(R()<0.25){c.fillStyle='rgba(20,26,44,0.35)';c.beginPath();c.ellipse(x+w/2,y+32,w*0.3,14,0,0,7);c.fill();}
      x+=w;}}
  for(let i=0;i<500;i++){c.fillStyle='rgba(20,24,34,'+rr(0.05,0.25)+')';c.fillRect(rr(0,W),rr(0,H),2,2);}
},[5,5]);
const slab2=slabTex.clone();slab2.repeat.set(3.6,2.3);slab2.needsUpdate=true;
const brickTex=ctex(256,256,(c,W,H)=>{
  c.fillStyle='#2c3440';c.fillRect(0,0,W,H);
  for(let r=0;r<16;r++)for(let k=-1;k<6;k++){const v=rr(-14,14)|0;c.fillStyle='rgb('+(96+v)+','+(110+v)+','+(124+v)+')';c.fillRect(k*48+(r%2?24:0)+1,r*16+1,46,14);}
  for(let i=0;i<14;i++){const x=rr(0,W),g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(14,20,34,0.5)');g.addColorStop(1,'rgba(14,20,34,0)');c.fillStyle=g;c.fillRect(x,0,rr(4,14),rr(60,220));}
},[1,1]);
const tileTex=ctex(128,128,(c,W,H)=>{
  c.fillStyle='#39465a';c.fillRect(0,0,W,H);
  for(let r=0;r<5;r++)for(let k=-1;k<5;k++){const x=k*32+(r%2?16:0),y=r*32-6;c.fillStyle=r%2?'#4c5c74':'#56677f';c.beginPath();c.arc(x+16,y,17,0,PI);c.fill();c.strokeStyle='#1e2634';c.lineWidth=2.5;c.beginPath();c.arc(x+16,y,17,0,PI);c.stroke();c.strokeStyle='rgba(190,215,255,0.35)';c.lineWidth=1.5;c.beginPath();c.arc(x+16,y,12,0.5,1.5);c.stroke();}
},[9,4]);
const woodTex=ctex(256,256,(c,W,H)=>{
  c.fillStyle='#c9a37f';c.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){c.strokeStyle='rgba(70,40,22,'+rr(0.08,0.3)+')';c.lineWidth=rr(1,3);const y=rr(0,H);c.beginPath();c.moveTo(0,y);c.bezierCurveTo(80,y+rr(-6,6),170,y+rr(-6,6),W,y);c.stroke();}
  for(let i=0;i<4;i++){c.fillStyle='rgba(50,28,16,0.35)';c.fillRect(0,i*64,W,2);}
},[1,1]);
const doorTex=ctex(128,256,(c,W,H)=>{
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe9b4');g.addColorStop(1,'#f0c884');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='#4a2c20';c.fillRect(0,H-56,W,56);c.fillStyle='#6a4030';c.fillRect(10,H-48,W-20,40);
  c.strokeStyle='#40261c';c.lineWidth=7;c.strokeRect(3,3,W-6,H-6);c.lineWidth=3;
  for(let i=1;i<4;i++){c.beginPath();c.moveTo(i*32,0);c.lineTo(i*32,H-56);c.stroke();}
  for(let j=1;j<6;j++){c.beginPath();c.moveTo(0,j*33);c.lineTo(W,j*33);c.stroke();}
});
const blindTex=ctex(128,128,(c,W,H)=>{c.fillStyle='#b99c5e';c.fillRect(0,0,W,H);for(let y=0;y<H;y+=6){c.fillStyle=y%12?'#8f7440':'#c9ae70';c.fillRect(0,y,W,2);}c.fillStyle='#4a3424';c.fillRect(24,0,3,H);c.fillRect(100,0,3,H);});
const inkTex=(vert)=>ctex(vert?128:256,256,(c,W,H)=>{
  c.fillStyle='#ecdcb8';c.fillRect(0,0,W,H);
  for(let k=0;k<3;k++){c.fillStyle='rgba(40,52,70,'+(0.25+k*0.2)+')';c.beginPath();c.moveTo(0,H);let x=0;while(x<=W){c.lineTo(x,H*(0.45+k*0.15)-Math.abs(Math.sin(x*0.04+k*2))*H*(0.25-k*0.05));x+=8;}c.lineTo(W,H);c.fill();}
  c.fillStyle='#c8402e';c.beginPath();c.arc(W*0.72,H*0.2,W*0.09,0,7);c.fill();
  c.fillStyle='#2a2a30';c.font='bold 22px '+FONT;c.fillText('雨',10,30);c.fillText('夜',10,56);
  c.strokeStyle='#5a4028';c.lineWidth=6;c.strokeRect(0,0,W,H);
});
const umbTex=ctex(128,64,(c,W,H)=>{c.fillStyle='#fff';c.fillRect(0,0,W,H);for(let i=0;i<16;i++){c.fillStyle=i%2?'rgba(0,0,0,0.10)':'rgba(255,255,255,0)';c.fillRect(i*8,0,8,H);c.fillStyle='rgba(40,20,10,0.6)';c.fillRect(i*8,0,1,H);}c.fillStyle='rgba(40,20,10,0.5)';c.fillRect(0,6,W,2);c.fillRect(0,40,W,2);},[1,1]);
const gutterTex=ctex(128,32,(c,W,H)=>{c.fillStyle='#0d1830';c.fillRect(0,0,W,H);for(let i=0;i<26;i++){c.strokeStyle='rgba(130,170,255,'+rr(0.15,0.55)+')';c.lineWidth=1;const x=rr(0,W),y=rr(3,H-3),l=rr(6,22);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l/2,y+rr(-3,3),x+l,y);c.stroke();}},[1,1]);
const runeTex=ctex(256,128,(c,W,H)=>{
  c.strokeStyle='#fff';c.fillStyle='#fff';c.lineWidth=2;
  for(let i=0;i<8;i++){const x=rr(10,60),y=10+i*12,x2=rr(90,170),dy=i%2?9:-7;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y);c.lineTo(x2+10,y+dy);c.lineTo(rr(190,246),y+dy);c.stroke();c.beginPath();c.arc(x,y,3,0,7);c.fill();}
  c.font='15px monospace';'0 1 7 茶 雨 3 9 巷 0 1'.split(' ').forEach((s,i)=>c.fillText(s,12+i*24,122));
});
const holoTex=(title,lines,col)=>ctex(256,256,(c,W,H)=>{
  c.fillStyle=col;c.globalAlpha=0.13;c.fillRect(0,0,W,H);c.globalAlpha=1;
  c.strokeStyle=col;c.lineWidth=3;c.strokeRect(4,4,W-8,H-8);c.fillStyle=col;
  c.font='bold 40px '+FONT;c.fillText(title,16,52);c.fillRect(16,66,W-32,3);
  c.font='22px '+FONT;lines.forEach((s,i)=>c.fillText(s,18,102+i*34));
  c.beginPath();c.arc(W-44,40,18,0,7);c.stroke();c.fillRect(W-110,H-30,90,6);c.fillRect(W-80,H-18,60,4);
  c.fillStyle='#000';c.globalAlpha=0.2;for(let y=0;y<H;y+=4)c.fillRect(0,y,W,1);
});
const poster=(bg,fg,ch,sub)=>ctex(128,180,(c,W,H)=>{
  c.fillStyle=bg;c.fillRect(0,0,W,H);c.strokeStyle=fg;c.lineWidth=4;c.strokeRect(6,6,W-12,H-12);
  c.fillStyle=fg;c.font='bold 84px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillText(ch,W/2,76);
  c.font='bold 15px monospace';c.fillText(sub,W/2,138);for(let i=0;i<5;i++)c.fillRect(18+i*20,154,12,6+(i%3)*4);
});
const vendTex=ctex(128,256,(c,W,H)=>{
  c.fillStyle='#0b1428';c.fillRect(0,0,W,H);c.fillStyle='#123a5c';c.fillRect(8,8,W-16,150);
  const cols=['#ff5a7a','#5fe8ff','#ffd35a','#9a7cff','#6affb0','#ff9a4a'];
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){c.fillStyle=cols[(r*3+k)%6];c.fillRect(16+k*26,16+r*36,16,24);c.fillStyle='#e8f4ff';c.fillRect(16+k*26,42+r*36,16,3);}
  c.fillStyle='#5fe8ff';c.font='bold 22px '+FONT;c.fillText('茶 饮',14,190);c.fillStyle='#ff5fc0';c.fillRect(84,172,30,22);
  c.fillStyle='#02040a';c.fillRect(20,210,88,30);
});

/* ---------- materials ---------- */
const grad=new THREE.DataTexture(new Uint8Array([70,135,200,255]),4,1,THREE.RedFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
const T=(c,o={})=>new THREE.MeshToonMaterial({color:c,gradientMap:grad,...o});
const B=(c,o={})=>new THREE.MeshBasicMaterial({color:c,...o});
const A=(c,op=1,o={})=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false,...o});
const DS=THREE.DoubleSide;
const M={
  ol:B(0x07060e,{side:THREE.BackSide}),line:new THREE.LineBasicMaterial({color:0x07060e}),
  white:T(0xffffff),plaster:T(0xc9ced6),plasterD:T(0xc9ced6,{side:DS}),brick:T(0xffffff,{map:brickTex}),
  stone:T(0x7c8796),stoneD:T(0x4c5462),slab:T(0x8f9ab0,{map:slabTex}),slab2:T(0xa7adb8,{map:slab2}),
  wood:T(0xb07a52,{map:woodTex}),woodD:T(0x4d3226),woodR:T(0x7d3a2c),
  tile:T(0x8fa0b8,{map:tileTex}),tileD:T(0x2b3442),tileR:T(0x3a4658),
  inner:T(0xf0cf9c,{emissive:0x8a5524,emissiveIntensity:0.8}),floor:T(0xb98556,{map:woodTex,emissive:0x4a2a12}),
  metal:T(0x3a4252),metalL:T(0x7f8c9e),clay:T(0x9c5c3e),clayD:T(0x4e3630),ceramic:T(0xe4ecf2),gold:T(0xd0a54c),red:T(0xb53030),
  green:T(0x3f9358),greenD:T(0x226244),leaf:T(0x3f9a5c,{side:DS}),straw:T(0xcdb074),cloth:T(0x34508c),cushion:T(0x9a5064),
  jar:T(0x5e4238,{side:DS}),dark:B(0x0a0a14),bead:B(0xcfe2ff),
  water:B(0x0c1630,{transparent:true,opacity:0.78,depthWrite:false}),water2:B(0x13264a),
  shadow:B(0x000000,{map:glowTex,transparent:true,opacity:0.55,depthWrite:false}),
  door:B(0xf4e6c8,{map:doorTex}),blind:T(0xffffff,{map:blindTex,side:DS}),
  noren:B(0xd8d8d8,{map:txt('茶',{bg:'#22386e',fg:'#ece6d6',fs:96,w:128,h:128}),side:DS}),
  banner:B(0xd0d0d0,{map:txt('茶铺',{v:true,bg:'#7a2230',fg:'#f3dfae',fs:80}),side:DS}),
  screen:T(0xffffff,{map:inkTex(false),emissive:0x3a2a18}),scroll:T(0xffffff,{map:inkTex(true),emissive:0x3a2a18}),
  gutter:B(0xffffff,{map:gutterTex,transparent:true,opacity:0.92}),cabGlow:B(0x1a5a78),
  paper:B(0xffe2a0)
};
const NB={c:new THREE.Color(0x35e8ff),m:new THREE.Color(0xff3fb4),p:new THREE.Color(0x9a5cff),b:new THREE.Color(0x3a7bff),o:new THREE.Color(0xff8a3a)};
const NK=Object.keys(NB),N={};NK.forEach(k=>N[k]=B(NB[k].getHex()));
const PAL=[0xe4ecf2,0x4a78b0,0x9c5c3e,0x3f7a6a,0xc98a3a,0xb53030,0x6a4a8a,0xd8c9a0];

/* ---------- geometries / instancers ---------- */
const G={box:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(1,1,1,14),sph:new THREE.SphereGeometry(1,14,10),pl:new THREE.PlaneGeometry(1,1),circ:new THREE.CircleGeometry(1,24),cone:new THREE.ConeGeometry(1,1,16,1,true),tor:new THREE.TorusGeometry(1,0.2,6,14)};
function IM(geo,mat,n){const m=new THREE.InstancedMesh(geo,mat,n);m.count=0;m.frustumCulled=false;scene.add(m);return m;}
const I={tile:IM(G.cyl,M.tileR,900),cap:IM(G.sph,M.tileD,900),bar:IM(G.box,M.woodD,3200),bead:IM(G.sph,M.bead,900),cb:IM(G.box,T(0xffffff),3200),cc:IM(G.cyl,T(0xffffff),1400)};
function addI(im,p,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0,col){
  _d.position.set(x,y,z);_d.rotation.set(rx,ry,rz);_d.scale.set(sx,sy,sz);_d.updateMatrix();_m.copy(_d.matrix);
  if(p&&p!==scene){p.updateWorldMatrix(true,false);_m.premultiply(p.matrixWorld);}
  const i=im.count++;im.setMatrixAt(i,_m);if(col!==undefined)im.setColorAt(i,_c.set(col));
}
const ib=(p,w,h,d,x,y,z,col,ry=0)=>addI(I.cb,p,x,y,z,w,h,d,0,ry,0,col);
const ic=(p,r,h,x,y,z,col)=>addI(I.cc,p,x,y,z,r,h,r,0,0,0,col);

/* ---------- helpers ---------- */
function uvBox(w,h,d,s){const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*dm[f][0]/s,uv.getY(k)*dm[f][1]/s);}return g;}
function box(p,w,h,d,x,y,z,mat,o=0.028,uv=0){
  const m=new THREE.Mesh(uv?uvBox(w,h,d,uv):G.box,mat);if(!uv)m.scale.set(w,h,d);m.position.set(x,y,z);p.add(m);
  if(o){const e=new THREE.Mesh(G.box,M.ol);if(uv)e.scale.set(w+2*o,h+2*o,d+2*o);else e.scale.set(1+2*o/w,1+2*o/h,1+2*o/d);m.add(e);}
  return m;
}
function cyl(p,r,h,x,y,z,mat,o=0.028){
  const m=new THREE.Mesh(G.cyl,mat);m.scale.set(r,h,r);m.position.set(x,y,z);p.add(m);
  if(o){const e=new THREE.Mesh(G.cyl,M.ol);e.scale.set(1+o/r,1+2*o/h,1+o/r);m.add(e);}
  return m;
}
function sph(p,rx,ry,rz,x,y,z,mat,o=0.028){
  const m=new THREE.Mesh(G.sph,mat);m.scale.set(rx,ry,rz);m.position.set(x,y,z);p.add(m);
  if(o){const e=new THREE.Mesh(G.sph,M.ol);e.scale.set(1+o/rx,1+o/ry,1+o/rz);m.add(e);}
  return m;
}
function pl(p,w,h,x,y,z,mat,ry=0,rx=0){const m=new THREE.Mesh(G.pl,mat);m.scale.set(w,h,1);m.position.set(x,y,z);m.rotation.order='YXZ';m.rotation.set(rx,ry,0);p.add(m);return m;}
const nb=(p,w,h,d,x,y,z,k)=>box(p,w,h,d,x,y,z,N[k],0);
function spr(p,x,y,z,sx,sy,col,op){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));s.position.set(x,y,z);s.scale.set(sx,sy,1);p.add(s);return s;}
const gp=(p,w,h,x,y,z,col,op,ry=0,rx=0)=>pl(p,w,h,x,y,z,A(col,op,{map:glowTex}),ry,rx);
const sign=(p,tex,w,h,x,y,z,ry=0,op=1,add=true,rx=0)=>pl(p,w,h,x,y,z,add?A(0xffffff,op,{map:tex}):B(0xffffff,{map:tex,transparent:true,side:DS}),ry,rx);
function shadow(p,w,d,x,z){const m=pl(p,w,d,x,0.014,z,M.shadow,0,-PI/2);m.renderOrder=-1;return m;}
function beam(p,x,y,z,r,h,col,op,flip,rz=1){const m=new THREE.Mesh(G.cone,A(col,op));m.scale.set(r,h,r*rz);m.position.set(x,y,z);if(flip)m.rotation.x=PI;p.add(m);return m;}

/* animation registries */
const flick=[],refls=[],sways=[],drops=[],rings=[],flows=[],roofs=[],norens=[],steam=[];
function refl(x,z,w,d,col,op){const m=gp(scene,w,d,x,0.02+refls.length*0.0004,z,col,op,0,-PI/2);refls.push({m,op,x,ph:R()*6});return m;}
function drip(sx,sy,sz,ey,sp,ringR,col=0x9fc4ff){const ph=R();drops.push({sx,sy,sz,ex:sx,ey,ez:sz,sp,ph,fall:1,s:0.035});if(ringR)rings.push({x:sx,y:ey+0.014,z:sz,r:ringR,sp,ph,k:2,c:new THREE.Color(col)});}
function slide(a,b,sp){drops.push({sx:a.x,sy:a.y,sz:a.z,ex:b.x,ey:b.y,ez:b.z,sp,ph:R(),fall:0,s:0.026});}
function ripple(x,z,r,sp,col=0x7f9fd8,y=0.03){rings.push({x,y,z,r,sp,ph:R(),k:1,c:new THREE.Color(col)});}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  // neon breathing
  NK.forEach((k,i)=>N[k].color.copy(NB[k]).multiplyScalar(0.74+0.26*Math.sin(t*1.25+i*1.7)));

  for(const f of flick){const k=0.9+0.06*Math.sin(t*7.3+f.ph)+0.04*Math.sin(t*13.1+f.ph*2.3)+(hash(Math.floor(t*9)+f.ph*31)>0.95?-0.12:0);
    f.mat.color.copy(f.base).multiplyScalar(k);if(f.gl)f.gl.material.opacity=f.go*k;if(f.L)f.L.intensity=f.I*k;}

    if(d.fall){const q=u/0.4;if(q>1){s=0;f=1;}else f=q*q;}else f=u;
    const o=i*16;dm[o]=s;dm[o+5]=s*(d.fall?2.4:1.5);dm[o+10]=s;dm[o+12]=d.sx+(d.ex-d.sx)*f;dm[o+13]=d.sy+(d.ey-d.sy)*f;dm[o+14]=d.sz+(d.ez-d.sz)*f;dm[o+15]=1;}
  dropIM.instanceMatrix.needsUpdate=true;
  // ripple rings

  for(let i=0;i<rings.length;i++){const r=rings[i],u=(t*r.sp+r.ph)%1,l=r.k===2?(u-0.4)/0.6:u;let b=0,s=0.001;
    if(l>0){s=r.r*(0.15+0.85*l);b=(1-l)*(1-l)*0.85;}
    const o=i*16;rm[o]=s;rm[o+5]=1;rm[o+10]=s;rm[o+12]=r.x;rm[o+13]=r.y;rm[o+14]=r.z;rm[o+15]=1;ringIM.setColorAt(i,_c.copy(r.c).multiplyScalar(b));}
  ringIM.instanceMatrix.needsUpdate=true;if(ringIM.instanceColor)ringIM.instanceColor.needsUpdate=true;
